*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#050507;color:#fcd9e1;font-family:Helvetica,Arial,sans-serif;letter-spacing:-.03em;overflow:hidden;-webkit-font-smoothing:antialiased}
body{touch-action:none;user-select:none;-webkit-user-select:none}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:default}
.top{position:fixed;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:center;font-size:15px;padding:16px max(16px,2.25vw);z-index:20;pointer-events:none;mix-blend-mode:normal}
.top>*{pointer-events:auto}.km{color:#fcd9e1;text-decoration:none}
.lang button{font:inherit;letter-spacing:inherit;background:none;border:0;color:#fcd9e1;opacity:.5;cursor:pointer;padding:0 0 0 .6em}.lang button.on{opacity:1}
#hint{position:fixed;left:0;right:0;bottom:9vh;text-align:center;font-size:clamp(11px,1.4vw,14px);letter-spacing:.26em;color:#fcd9e1;pointer-events:none;text-shadow:0 0 14px #ff5d8f99;padding:0 16px;display:none;z-index:5}
#hint.bl{animation:bl 1.7s ease-in-out infinite}@keyframes bl{50%{opacity:.3}}
#tag{position:fixed;left:50%;top:64px;transform:translate(-50%,8px);text-align:center;opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;z-index:5;display:flex;flex-direction:column;gap:6px;align-items:center}
#tag.on{opacity:1;transform:translate(-50%,0)}
#tag b{font-size:clamp(18px,2.4vw,26px);font-weight:700;color:#fcd9e1;letter-spacing:.02em}#tag span{font-size:12px;letter-spacing:.22em;color:#ff9bb3;text-transform:uppercase}#tag i{font-style:normal;font-size:12px;letter-spacing:.26em;color:#fff;opacity:1;margin-top:2px;background:#0a0a0acc;padding:8px 14px;border-radius:99px}
.ar{display:none;position:fixed;top:50%;transform:translateY(-50%);width:54px;height:54px;border-radius:50%;border:1.5px solid #fcd9e188;background:#0a0a0a99;color:#fcd9e1;z-index:6;padding:13px;cursor:pointer;-webkit-tap-highlight-color:transparent;backdrop-filter:blur(4px)}
.ar svg{width:100%;height:100%;display:block}.ar:active{background:#ff9bb3;color:#0a0a0a;border-color:#ff9bb3}#aL{left:12px}#aR{right:12px}
@media(pointer:coarse){body.free .ar{display:block}}
body.era-open .ar,body.era-open #tag,body.era-open #hint{display:none!important}
#era{position:fixed;inset:0;background:#0a0a0a;z-index:30;overflow-y:auto;overflow-x:hidden;opacity:0;visibility:hidden;transition:opacity .45s,visibility 0s .45s;-webkit-overflow-scrolling:touch;touch-action:pan-y;user-select:text;-webkit-user-select:text}
#era.on{opacity:1;visibility:visible;transition:opacity .45s}
.x{position:fixed;top:14px;right:max(16px,2.25vw);z-index:35;font:inherit;font-size:13px;letter-spacing:.2em;color:#fcd9e1;background:#0a0a0acc;border:1px solid #fcd9e144;padding:8px 14px;border-radius:99px;cursor:pointer}
.wrap{max-width:1040px;margin:0 auto;padding:72px max(20px,3vw) 90px}
.eh{display:grid;grid-template-columns:minmax(220px,440px) 1fr;gap:clamp(24px,4vw,56px);align-items:end}
#ec{width:100%;display:block;box-shadow:0 24px 70px #000c;border:1px solid #ffffff14}
.kind{font-size:12px;letter-spacing:.3em;color:#ff9bb3;margin-bottom:12px}
#et{font-weight:400;color:#fcd9e1;font-size:clamp(32px,4.4vw,68px);line-height:.95;letter-spacing:-.02em;margin-bottom:18px;overflow-wrap:break-word}
.meta{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:#ff9bb3;margin-bottom:18px}
#es{color:#d9c8cd;line-height:1.55;max-width:48ch;margin-bottom:20px;font-size:15px}
.links{display:flex;flex-wrap:wrap;gap:10px}.links a{color:#fcd9e1;text-decoration:none;font-size:12px;letter-spacing:.18em;text-transform:uppercase;border:1px solid #fcd9e166;padding:9px 14px;border-radius:99px}.links a:hover{background:#fcd9e1;color:#0a0a0a}
section{margin-top:64px}
h3{font-size:12px;letter-spacing:.3em;color:#ff9bb3;font-weight:400;margin-bottom:22px;padding-bottom:12px;border-bottom:1px solid #fcd9e122}
.tl{list-style:none;columns:2;column-gap:44px}.tl li{display:grid;grid-template-columns:34px 1fr auto;gap:10px;padding:11px 0;border-bottom:1px solid #fcd9e114;break-inside:avoid;font-size:15px}
.tl b{font-weight:400;color:#ff9bb3;font-size:12px;letter-spacing:.1em;padding-top:2px}.tl em{font-style:normal;color:#fcd9e199;font-size:13px}
@media(max-width:760px){.eh{grid-template-columns:1fr}.tl{columns:1}.wrap{padding-top:64px}}
.soon{font-size:12px;letter-spacing:.28em;color:#fcd9e166;padding:30px 0;border:1px dashed #fcd9e122;text-align:center}
/* booklet */
.bkw{display:flex;justify-content:center;perspective:2600px;padding:18px 12px 10px;overflow:hidden;--pw:420px;box-sizing:border-box;width:100%}
.bk{position:relative;width:calc(var(--pw)*2);height:calc(var(--pw)/var(--r,1));transition:transform .9s cubic-bezier(.45,.05,.25,1);cursor:pointer;touch-action:pan-y}
.sh{position:absolute;left:50%;top:0;width:var(--pw);height:calc(var(--pw)/var(--r,1));transform-origin:left center;transform-style:preserve-3d;transition:transform .9s cubic-bezier(.5,.05,.22,1)}
.sh.fl{transform:rotateY(-180deg)}
.sh .f,.sh .b{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:#141214 center/cover no-repeat;box-shadow:0 10px 40px #0009}
.sh .b{transform:rotateY(180deg)}.sh .b.blank{background:#141214}
.sh .f::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#0007 0,#0000 7%,#0000 92%,#0003 100%);pointer-events:none}
.sh .b::after{content:"";position:absolute;inset:0;background:linear-gradient(270deg,#0007 0,#0000 7%,#0000 92%,#0003 100%);pointer-events:none}
.bkh{text-align:center;font-size:11px;letter-spacing:.26em;color:#fcd9e199;margin-top:20px}
.gal{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}@media(max-width:700px){.gal{grid-template-columns:repeat(2,1fr)}}
.gi{border:0;background:#141214;padding:0;cursor:zoom-in;aspect-ratio:4/3;overflow:hidden}.gi img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s,opacity .3s;opacity:.92}.gi:hover img{transform:scale(1.05);opacity:1}
#lb{position:fixed;inset:0;background:#000e;z-index:50;display:none;align-items:center;justify-content:center;cursor:zoom-out}#lb.on{display:flex}#lb img{max-width:94vw;max-height:90vh;display:block;cursor:pointer}
@media(prefers-reduced-motion:reduce){.sh,.bk{transition-duration:.01s}}

.logo731{height:clamp(50px,8.4vw,112px);width:auto;display:block;margin:4px 0 6px}.logo731.s{height:15px;display:inline-block;vertical-align:middle;margin:0 2px 0 0}

/* etiket tipografisi: Helvetica Bold, -75 tracking */
.kind,.meta,h3,.links a,.x,.bkh,.soon,#tag i,#hint,.lang,.top .km,.tl b,.tl em{font-family:Helvetica,"Helvetica Neue",Arial,sans-serif!important;font-weight:700!important;letter-spacing:-.075em!important}
.kind{font-size:14px}.meta{font-size:15px}h3{font-size:15px}.links a{font-size:15px;padding:10px 16px}.x{font-size:15px}.bkh{font-size:13px}#hint{font-size:clamp(13px,1.6vw,16px)}#tag i{font-size:14px}.soon{font-size:14px}

.links a{text-transform:none!important}

.logo731.lh{height:clamp(46px,7vw,96px)}.logo731.s.lh{height:18px}

#et{color:#ffe2b0!important}

.fsb{display:block;margin:12px auto 0;background:none;border:1px solid #fcd9e144;color:#ffe2b0;padding:9px 16px;border-radius:99px;cursor:pointer;font-size:13px}.fsb:hover{background:#fcd9e11a}
#bkfs{position:fixed;inset:0;z-index:60;background:#000;display:none}#bkfs.on{display:block}#bkfs .bkw{height:100%;align-items:center;padding:16px;overflow:hidden}#bkfs .x{position:absolute;right:16px;top:14px;z-index:5}
.vh{display:flex;align-items:baseline;justify-content:space-between;gap:12px}.vh a{color:#ffe2b0;font-size:13px;text-decoration:none;opacity:.8}.vh a:hover{opacity:1}
.vids{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x proximity;padding:4px 2px 14px;scrollbar-width:thin;scrollbar-color:#fcd9e133 transparent;-webkit-overflow-scrolling:touch}
.vc{flex:0 0 clamp(210px,24vw,280px);background:none;border:0;padding:0;text-align:left;cursor:pointer;scroll-snap-align:start;color:#fcd9e1;display:flex;flex-direction:column;gap:8px}
