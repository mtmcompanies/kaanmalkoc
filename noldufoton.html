.bg:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,10,10,.5) 0%,rgba(10,10,10,0) 18%,rgba(10,10,10,.05) 40%,rgba(10,10,10,.92) 78%,#0a0a0a 100%)}
main{position:relative;z-index:1;min-height:100vh;min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:max(20px,env(safe-area-inset-top)) 18px max(22px,env(safe-area-inset-bottom));text-align:center;gap:18px}
.top{display:flex;align-items:center;gap:14px;justify-content:center;width:100%}
.top img{display:block;height:clamp(24px,4vw,44px);width:auto;filter:drop-shadow(0 2px 8px #000)}
.top span{font-family:Era731,serif;font-size:clamp(18px,2.4vw,26px);opacity:.85}
.mid{margin-top:auto;width:100%;display:flex;flex-direction:column;align-items:center;gap:clamp(12px,2.2vh,24px)}
.title{width:min(540px,80vw,46vh);height:auto;display:block;filter:drop-shadow(0 6px 24px rgba(255,93,240,.45))}
.date{font-size:clamp(11px,1.5vw,14px);letter-spacing:.34em;opacity:.92}
.cd{display:flex;gap:clamp(8px,1.6vw,16px)}
.cd div{min-width:clamp(62px,13vw,98px);padding:clamp(10px,1.6vw,15px) 0 clamp(8px,1.2vw,11px);background:#0a0a0acc;border:1px solid rgba(255,93,240,.5);border-radius:14px;box-shadow:0 0 28px rgba(255,93,240,.18)}
.cd b{display:block;font-family:Era731,serif;font-weight:400;font-size:clamp(30px,min(6.6vw,8vh),60px);line-height:1;color:var(--p);text-shadow:0 0 18px rgba(255,93,240,.6);font-variant-numeric:tabular-nums}
.cd small{display:block;margin-top:6px;font-size:clamp(8px,1.3vw,11px);letter-spacing:.24em;color:#fcd9e1}
.btns{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.pill{display:inline-block;padding:14px 26px;border-radius:99px;font-size:12px;letter-spacing:.22em;text-decoration:none;font-weight:700;border:1.5px solid var(--p);color:var(--p);background:#0a0a0acc;transition:transform .2s,box-shadow .2s;min-height:44px}
.pill.f{background:var(--p);color:#0a0a0a}.pill:hover,.pill:focus-visible{transform:translateY(-2px);box-shadow:0 0 22px rgba(255,93,240,.55);outline:0}
.live .cd,.live .pre{display:none}.live .post{display:flex}.post{display:none}
.foot{font-size:10px;letter-spacing:.2em;opacity:.5}.foot a{color:#fff;text-decoration:none}
